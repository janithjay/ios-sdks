# Runs the Quickstart E2E suite against the latest published ThunderID release, every night.
#
# The PR builder runs the same suite through the same composite action. The nightly exists
# because these flows talk to a freshly downloaded server release, so a scheduled run catches
# breakage introduced by a new server release rather than by a change in this repository.
#
# Uses:
#   OS: macos-latest

name: 🌙 Nightly E2E

on:
  schedule:
    # 02:30 UTC.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      thunderid-version:
        description: ThunderID release to test against, without the leading "v". Blank uses the latest.
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_NAME: "ThunderID"

jobs:
  e2e:
    name: 🎭 E2E Tests
    uses: ./.github/workflows/run-e2e-suite.yml
    with:
      thunderid-version: ${{ inputs.thunderid-version }}
      artifact-suffix: -nightly

  # Nothing notifies on a scheduled run, so a nightly that breaks stays invisible until someone
  # opens the Actions tab. This posts each failure to Google Chat as its own message, matching
  # what javascript-sdks already does.
  #
  # It is a separate job rather than a step because `e2e` calls a reusable workflow, and a job
  # that uses one cannot also carry steps.
  notify:
    name: 🔔 Notify on Failure
    needs: e2e
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔔 Send Google Chat Notification on Failure
        shell: bash
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$GOOGLE_CHAT_WEBHOOK" ]; then
            echo "GOOGLE_CHAT_WEBHOOK secret is not set. Skipping Google Chat notification."
            exit 0
          fi

          FAILURE_DATE=$(date -u +"%d-%m-%Y")

          jq -n \
            --arg run_number "$RUN_NUMBER" \
            --arg commit "${COMMIT:0:8}" \
            --arg workflow_url "$WORKFLOW_URL" \
            --arg failure_date "$FAILURE_DATE" \
            '{
              "cards": [{
                "header": {
                  "title": "🔴 iOS SDKs E2E Failed",
                  "subtitle": ("Nightly - " + $failure_date),
                  "imageUrl": "https://raw.githubusercontent.com/github/explore/main/topics/swift/swift.png",
                  "imageStyle": "AVATAR"
                },
                "sections": [
                  {
                    "widgets": [
                      {"keyValue": {"topLabel": "Run", "content": ("#" + $run_number)}},
                      {"keyValue": {"topLabel": "Commit", "content": $commit}}
                    ]
                  },
                  {
                    "widgets": [
                      {
                        "buttons": [
                          {
                            "textButton": {
                              "text": "VIEW WORKFLOW RUN",
                              "onClick": {"openLink": {"url": $workflow_url}}
                            }
                          }
                        ]
                      }
                    ]
                  }
                ]
              }]
            }' > payload.json

          if curl -f -X POST -H "Content-Type: application/json" -d @payload.json "$GOOGLE_CHAT_WEBHOOK"; then
            echo "✅ Google Chat notification sent successfully"
          else
            echo "⚠️ Failed to send Google Chat notification"
          fi
